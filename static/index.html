<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机器狗多模态视觉理解系统</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 50px; background-color: #f5f5f5;}
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .image-box { border: 2px dashed #ccc; width: 400px; min-height: 300px; background: white; padding: 10px;}
        img { max-width: 100%; height: auto; }
        #loading { display: none; color: #ff5722; font-weight: bold; margin-top: 10px;}
    </style>
</head>

<body>

    <h1> 基于多模态的机器狗视觉理解</h1>
    <div>
        <input type="file" id="imageInput" accept="image/jpeg, image/png">
        <button onclick="uploadImage()">执行 2D 场景理解</button>
    </div>

    <div style="margin-top: 20px;">
        <input type="file" id="pcdInput" accept=".pcd,.ply,.bin">
        <button onclick="uploadPointCloud()">执行 3D 场景理解</button>
    </div>
    
    <div id="loading">模型推理中，请稍候...</div>

    <div class="container" id="3d-container" style="display: none; margin-top: 40px;">
        <div class="image-box" style="width: 800px;">
            <h3>3D 点云语义聚类结果 (降级渲染)</h3>
            <img id="result3dImg" src="" alt="3D渲染截图将在这里显示">
        </div>
    </div>

    <div class="container">
        <div class="image-box">
            <h3>原始图像</h3>
            <img id="originalImg" src="" alt="上传后显示原图">
        </div>
        <div class="image-box">
            <h3>语义分割结果</h3>
            <img id="resultImg" src="" alt="结果将在这里显示">
        </div>
    </div>

    <script>
        async function uploadPointCloud() {
            const fileInput = document.getElementById('pcdInput');
            if (fileInput.files.length === 0) {
                alert("请先选择一个点云文件 (.pcd)！");
                return;
            }

            const file = fileInput.files[0];
            
            // 清空之前的图，显示 3D 容器，并开启 loading 提示
            document.getElementById('result3dImg').src = "";
            document.getElementById('3d-container').style.display = 'flex';
            document.getElementById('loading').innerText = "3D 点云处理中，耗时较长，请耐心等待...";
            document.getElementById('loading').style.display = 'block';

            // 构造表单数据
            const formData = new FormData();
            formData.append("file", file);

            try {
                // 发送给后端的 /api/analyze/3d 接口
                const response = await fetch('/api/analyze/3d', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === "success") {
                    // 显示后端渲染好并返回的 3D 截图
                    document.getElementById('result3dImg').src = data.result_url;
                } else {
                    alert("3D 处理失败！");
                }
            } catch (error) {
                console.error("请求出错:", error);
                alert("网络请求出错！请检查后端是否正常运行。");
            } finally {
                // 恢复 loading 状态
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loading').innerText = "模型推理中，请稍候...";
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) {
                alert("请先选择一张图片！");
                return;
            }

            const file = fileInput.files[0];
            
            // 显示原图预览
            document.getElementById('originalImg').src = URL.createObjectURL(file);
            document.getElementById('resultImg').src = "";
            
            // 显示加载提示
            document.getElementById('loading').style.display = 'block';

            // 构造表单数据
            const formData = new FormData();
            formData.append("file", file);

            try {
                // 发送给后端
                const response = await fetch('/api/analyze/2d', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === "success") {
                    // 显示处理后的结果图
                    document.getElementById('resultImg').src = data.result_url;
                } else {
                    alert("处理失败！");
                }
            } catch (error) {
                console.error("请求出错:", error);
                alert("网络请求出错！");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>

</body>
</html>
